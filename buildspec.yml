version: 0.2

phases: 
  install:
  runtime-versions:
    nodejs: 22
  commands:
    - echo Installing dependencies...
    - cd frontend
    - npm ci --legacy-peer-deps
  
  build:
    commands:
      - echo Building the React app...
      - npm run build
  
  artifacts:
    files:
      - '**/*'
    base-directory: frontend/dist
    discard-paths: no

  